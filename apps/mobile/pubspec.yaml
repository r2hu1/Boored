name: boored
description: Classroom whiteboard digitization app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.0
  dio: ^5.11.0
  path_provider: ^2.1.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  cupertino_icons: ^1.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0
  uuid: ^4.5.1
  path: ^1.9.0
  camera: ^0.12.1
  permission_handler: ^12.0.3
  wakelock_plus: ^1.8.2
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
