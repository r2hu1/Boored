name: Mobile Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run build_runner (generate drift database code)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env from GitHub Secrets
        working-directory: apps/mobile
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env

      - name: Build Android APK (Fat / Universal Release)
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB for Play Store)
        working-directory: apps/mobile
        run: flutter build appbundle --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: boored-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: boored-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
